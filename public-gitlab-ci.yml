stages:
  - deploy

package:
  image: mcr.microsoft.com/dotnet/sdk:8.0
  variables:
    PACKAGE_VERSION: "INTERNAL_PACKAGE_VERSION"
    TARGET_FRAMEWORK: 'netstandard2.0'
  stage: deploy
  script:
    - |
      echo "${PACKAGE_VERSION}"     
      dotnet nuget add source "$CI_SERVER_URL/api/v4/groups/93493963/-/packages/nuget/index.json" --name gitlab --username gitlab-ci-token --password $CI_JOB_TOKEN --store-password-in-clear-text
      dotnet build DCP.Framework.Exceptions/DCP.Framework.Exceptions.csproj -c Release -p:TargetFrameworks=${TARGET_FRAMEWORK}    
      dotnet pack DCP.Framework.Exceptions/DCP.Framework.Exceptions.csproj -p:Version=${PACKAGE_VERSION} -c Release -p:TargetFrameworks=${TARGET_FRAMEWORK}
      dotnet nuget add source "$CI_SERVER_URL/api/v4/projects/$CI_PROJECT_ID/packages/nuget/index.json" --name project --username gitlab-ci-token --password $CI_JOB_TOKEN --store-password-in-clear-text
      echo "Pushing package to registry."      
      dotnet nuget push "$CI_PROJECT_DIR/DCP.Framework.Exceptions/bin/Release/*.nupkg" --source project --no-symbols
